<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Booking — Премиум Система</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col antialiased">

    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 pointer-events-none transition-all duration-300 ease-out px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-2 border"></div>

    <header class="border-b border-slate-900 bg-slate-950/70 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="checkAuthAndRedirect()">
                <span class="text-xl font-black tracking-wider text-indigo-500">SPORTS<span class="text-emerald-400">BOOK</span></span>
                <span class="text-[10px] uppercase tracking-widest px-2 py-0.5 bg-slate-900 border border-slate-800 rounded text-slate-400 font-mono">v1.0</span>
            </div>
            <div id="user-profile-nav" class="hidden items-center space-x-4">
                <div class="text-right">
                    <p id="nav-user-email" class="text-xs text-slate-400 font-mono"></p>
                    <span id="nav-user-role" class="text-[10px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded"></span>
                </div>
                <button onclick="logout()" class="px-3 py-1.5 text-xs font-semibold bg-slate-900 hover:bg-rose-950/30 hover:text-rose-400 hover:border-rose-900/50 border border-slate-800 rounded-lg transition-all">Выйти</button>
            </div>
            <div id="guest-nav" class="flex items-center space-x-2">
                <button onclick="showPage('login')" class="px-4 py-2 text-xs font-semibold text-slate-400 hover:text-white transition">Войти</button>
                <button onclick="showPage('register')" class="px-4 py-1.5 text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 rounded-lg text-white shadow-lg shadow-indigo-600/20 transition-all">Регистрация</button>
            </div>
        </div>
    </header>

    <main id="app-content" class="flex-grow max-w-7xl w-full mx-auto px-4 py-8">
        </main>

    <div id="booking-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 opacity-0 pointer-events-none transition-opacity duration-300 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-6 shadow-2xl transform scale-95 transition-transform duration-300">
            <h3 class="text-lg font-bold text-slate-100 mb-1" id="modal-field-name">Бронирование площадки</h3>
            <p class="text-xs text-indigo-400 font-mono mb-4" id="modal-field-price"></p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Дата сессии</label>
                    <input type="date" id="book-date" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm font-mono focus:outline-none focus:border-indigo-500 transition">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Время начала</label>
                        <input type="time" id="book-start" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm font-mono focus:outline-none focus:border-indigo-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Время окончания</label>
                        <input type="time" id="book-end" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm font-mono focus:outline-none focus:border-indigo-500 transition">
                    </div>
                </div>
            </div>

            <div class="flex items-center space-x-3 mt-6">
                <button onclick="closeBookingModal()" class="w-1/2 py-2.5 text-xs font-bold uppercase tracking-wider bg-slate-950 hover:bg-slate-800 border border-slate-800 rounded-xl transition text-slate-400 hover:text-white">Отмена</button>
                <button onclick="executeBooking()" class="w-1/2 py-2.5 text-xs font-bold uppercase tracking-wider bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl shadow-lg shadow-emerald-600/10 transition">Подтвердить</button>
            </div>
        </div>
    </div>

    <script src="src/api.js"></script>
</body>
</html>
