<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Booking — Система бронирования</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">

    <header class="border-b border-slate-800 bg-slate-950/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-xl font-bold tracking-wider text-indigo-400">SPORTS<span class="text-emerald-400">BOOK</span></span>
            </div>
            <nav id="nav-auth" class="flex items-center space-x-4">
                <button onclick="showPage('login')" class="px-4 py-2 text-sm font-medium text-slate-300 hover:text-white transition">Войти</button>
                <button onclick="showPage('register')" class="px-4 py-2 text-sm font-medium bg-indigo-600 hover:bg-indigo-500 rounded-lg text-white transition">Регистрация</button>
            </nav>
        </div>
    </header>

    <main id="app-content" class="flex-grow max-w-7xl w-full mx-auto px-4 py-8">
        </main>

    <script src="src/api.js"></script>
</body>
</html>
